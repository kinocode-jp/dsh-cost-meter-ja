name: Publish to npm

# Publishes @kinocode/dsh-cost-meter-ja from this kinocode-jp repository with npm Trusted Publishing (OIDC): npm records
# "GitHub Actions" as the publisher with provenance for this repository and commit, and no personal
# npm account or token is involved. Trigger: push a tag v<version> that matches package.json
# (or run by hand on such a tag). See RELEASING.md.

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'
      # Trusted Publishing needs npm 11.5.1 or later.
      - run: npm install -g npm@latest
      - name: Check that the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF_TYPE" != "tag" ] || [ "$GITHUB_REF_NAME" != "$version" ]; then
            echo "::error::Run this on the tag $version (got $GITHUB_REF_TYPE $GITHUB_REF_NAME)."
            exit 1
          fi
      # lib/ is built and committed (node scripts/build.mjs); it is published as committed.
      - run: npm publish --access public
